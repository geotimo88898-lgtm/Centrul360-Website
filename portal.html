<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Centrul360 Admin</title>
<link rel="icon" type="image/png" href="/brand_asset/portal/favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/brand_asset/portal/favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/brand_asset/portal/icon-180.png">
<link rel="manifest" href="/portal-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Centrul360">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#07080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Accent colour before first paint (picked in the avatar menu; computed by portal-accent.js).
  try { var v = JSON.parse(localStorage.getItem('c360_accent_v') || 'null'); if (v) for (var k in v) if (/^--accent/.test(k)) document.documentElement.style.setProperty(k, v[k]); } catch (e) {}
  // Text size and motion (Contul meu → Preferințe), also before the first paint.
  try { var pf = JSON.parse(localStorage.getItem('c360_prefs') || 'null'); if (pf) { if (pf.fontSize === 'lg' || pf.fontSize === 'xl') document.documentElement.setAttribute('data-fs', pf.fontSize); if (pf.motion === 'reduced') document.documentElement.classList.add('c360-reduce'); } } catch (e) {}
</script>
<style>
  /* Layout skeleton only, every visual rule lives in portal-theme.css / portal-kit.css / portal-sections.css. */
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  h1,h2,h3,h4{ margin:0; }
  .hidden{ display:none !important; }
  #loadingScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
  header.topbar{ position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; }
  .who{ text-align:right; line-height:1.3; }
  .who b, .who span{ display:block; }
  .who span[hidden]{ display:none; }
  .logoutBtn{ border-radius:999px; cursor:pointer; margin-left:1rem; font-family:inherit; font-size:.8rem; }
  .shell{ display:flex; }
  nav.tabs{ flex:none; display:flex; flex-direction:column; }
  nav.tabs button{ text-align:left; background:none; border:none; font-family:inherit; cursor:pointer; display:flex; align-items:center; }
  nav.tabs .nav-group-label{ text-transform:uppercase; }
  main{ flex:1; min-width:0; }
  #creativeFrame{ display:block; width:100%; border:0; }
  #creativeMsg{ padding:1.8rem 2rem; color:var(--muted); }
  .panel{ display:none; }
  .panel.active{ display:block; }
  input:not([type=checkbox]):not([type=radio]), select, textarea{ width:100%; font-family:inherit; }
  textarea{ resize:vertical; }
  @media (max-width:720px){ .shell{ flex-direction:column; } nav.tabs{ width:100%; flex-direction:row; overflow-x:auto; } nav.tabs .nav-group-label{ display:none; } }
  @media print{
    header.topbar, nav.tabs, .no-print, .k-drawer-root, .c360-toasts{ display:none !important; }
    body{ background:#fff !important; color:#000 !important; }
    main{ padding:0 !important; max-width:100% !important; }
    .shell{ display:block; }
  }
</style>
<link rel="stylesheet" href="/portal-theme.css">
<link rel="stylesheet" href="/portal-kit.css">
<link rel="stylesheet" href="/portal-sections.css">
<link rel="stylesheet" href="/portal-pipeline.css">
<link rel="stylesheet" href="/portal-v2.css">
<script src="/portal-accent.js" defer></script>
<script src="/portal-ui.js" defer></script>
<script src="/portal-kit.js" defer></script>
<script src="/portal-pipeline.js" defer></script>
<script src="/portal-dashboard.js" defer></script>
<script src="/portal-calendar.js" defer></script>
<script src="/portal-money.js" defer></script>
<script src="/portal-work.js" defer></script>
<script src="/portal-academy.js" defer></script>
<script src="/portal-contacts.js" defer></script>
<script src="/portal-condica.js" defer></script>
<script src="/portal-whatsapp.js" defer></script>
<script src="/portal-admin.js" defer></script>
<script src="/portal-builder.js" defer></script>
<script src="/portal-wa.js" defer></script>
<script src="/portal-automations.js" defer></script>
<script src="/portal-forms.js" defer></script>
<script src="/portal-ads.js" defer></script>
<script src="/portal-me.js" defer></script>
<script src="/portal-notif.js" defer></script>
<script src="/portal-core.js" defer></script>
<script src="/portal-mobile-nav.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/portal-sw.js').catch(function () {});
  }
</script>
</head>
<body>

<div id="loadingScreen">Se încarcă portalul...</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>Centrul360 · Portal echipă</div>
    <div style="display:flex; align-items:center;">
      <div class="who"><b id="whoName"></b><span id="whoLocation"></span></div>
      <button class="logoutBtn" id="logoutBtn">Deconectare</button>
    </div>
  </header>

  <div class="shell">
    <nav class="tabs" id="tabsNav">
      <button data-tab="panou" class="active"><svg></svg>Panou</button>
      <div class="nav-group-label">Clinică</div>
      <button data-tab="programari"><svg></svg>Calendar</button>
      <button data-tab="mesaje"><svg></svg>Mesaje</button>
      <button data-tab="incasari"><svg></svg>Încasări</button>
      <button data-tab="pipeline"><svg></svg>Pipeline</button>
      <button data-tab="contacte"><svg></svg>Contacte</button>
      <button data-tab="automatizari" data-roles="receptie"><svg></svg>Sarcini</button>
      <div class="nav-group-label" data-roles="receptie,cosmetician">Echipă</div>
      <button data-tab="comision" data-roles="receptie,cosmetician"><svg></svg>Salariu</button>
      <button data-tab="traininguri" data-roles="receptie,cosmetician"><svg></svg>Traininguri</button>
      <button data-tab="condica" data-roles="receptie,cosmetician"><svg></svg>Condică</button>
      <button data-tab="ofertele" data-roles="receptie,cosmetician"><svg></svg>Oferte</button>
      <div class="nav-group-label admin-only hidden">Admin</div>
      <button data-tab="aprobari" class="admin-only hidden"><svg></svg>Aprobări</button>
      <button data-tab="angajati" class="admin-only hidden"><svg></svg>Echipa</button>
      <button data-tab="fluxuri" class="admin-only hidden"><svg></svg>Automatizări</button>
      <button data-tab="integrari" class="admin-only hidden"><svg></svg>Integrări</button>
      <button data-tab="oferte" class="admin-only hidden"><svg></svg>Oferte</button>
      <button data-tab="traininguri" data-roles="admin" data-dup="1"><svg></svg>Traininguri</button>
      <div class="nav-group-label admin-only hidden">Marketing · Creative</div>
      <button data-tab="reclame" class="admin-only hidden"><svg></svg>Reclame</button>
      <button data-tab="creative" data-route="/" class="admin-only hidden"><svg></svg>Galerie creative</button>
      <button data-tab="creative" data-route="/convertor" class="admin-only hidden"><svg></svg>Convertor oraș</button>
      <button data-tab="creative" data-route="/video" class="admin-only hidden"><svg></svg>Scripturi video</button>
      <button data-tab="creative" data-route="/referinte" class="admin-only hidden"><svg></svg>Referințe</button>
      <button data-tab="creative" data-route="/cunostinte" class="admin-only hidden"><svg></svg>Cunoștințe</button>
      <button data-tab="creative" data-route="/setari" class="admin-only hidden"><svg></svg>Setări Creative</button>
    </nav>

    <main>
      <section class="panel active" id="panel-panou"></section>
      <section class="panel" id="panel-programari"></section>
      <section class="panel" id="panel-mesaje"></section>
      <section class="panel" id="panel-incasari"></section>
      <section class="panel" id="panel-pipeline"></section>
      <section class="panel" id="panel-contacte"></section>
      <section class="panel" id="panel-automatizari"></section>
      <section class="panel staff-only" id="panel-comision"></section>
      <section class="panel" id="panel-traininguri"></section>
      <section class="panel" id="panel-condica"></section>
      <section class="panel" id="panel-ofertele"></section>
      <section class="panel admin-only hidden" id="panel-aprobari"></section>
      <section class="panel admin-only hidden" id="panel-angajati"></section>
      <section class="panel admin-only hidden" id="panel-fluxuri"></section>
      <section class="panel admin-only hidden" id="panel-integrari"></section>
      <section class="panel admin-only hidden" id="panel-oferte"></section>
      <section class="panel admin-only hidden" id="panel-reclame"></section>
      <!-- CREATIVE (admin), the creative machine, opened inside the portal with single sign-on -->
      <section class="panel admin-only hidden" id="panel-creative">
        <p id="creativeMsg">Se deschide mașina de creative…</p>
        <iframe id="creativeFrame" title="Creative" class="hidden" allow="clipboard-write"></iframe>
      </section>
    </main>
  </div>
</div>

</body>
</html>
