# The automations' clock: once an hour (the owner, 20.10: "odată pe oră e de ajuns"; at */5 GitHub ran it only every
# ~5 hours anyway) it asks the portal to send what is due (the reminders the day before at 9:00 and 2h before,
# the waits of any flow) and to read new Facebook leads, so they go on time even when nobody has the
# portal open. Vercel's own cron (vercel.json) runs only once a day. GitHub may start a run a few minutes late; the
# portal skips a "before the appointment" message that would come more than 45 minutes late.
# 7.11: since the move to Cloudflare the portal needs CRON_SECRET and this repository has none, so every run got 401.
# The clock now runs inside Cloudflare (wrangler.jsonc "17 * * * *", cf/worker.js scheduled), every hour, with the
# secret it already has. This workflow stays only for a manual run (needs CRON_SECRET in Settings → Secrets → Actions).
name: Ceasul automatizărilor

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: automations-clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trimite ce e la rând
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          auth=()
          if [ -n "$CRON_SECRET" ]; then auth=(-H "Authorization: Bearer $CRON_SECRET"); fi
          for i in 1 2 3; do
            code=$(curl -s -o tick.json -m 60 -w "%{http_code}" "${auth[@]}" "https://admin.centrul360.com/api/automation-tick?light=1") || code=000
            echo "automation-tick: $code"
            # what the ads guard did, counts only (the repository is public: no campaign names in its logs)
            [ -f tick.json ] && jq -c '{once} + (.ads | {checked, skipped, error, done: ((.done // []) | map(split(":")[0]) | group_by(.) | map({(.[0]): length}) | add)})' tick.json 2>/dev/null || true
            # the creative orders asked for in chat: how far they got (no links: drafts aren't public material)
            [ -f tick.json ] && jq -c '.creative // empty | if type == "object" then with_entries(.value |= (if type == "object" then {request, error, published: ((.published // {}) | length), creatives: ((.creatives // []) | map(.status))} else . end)) else . end' tick.json 2>/dev/null || true
            [ -f tick.json ] && jq -c '{waited, ms}' tick.json 2>/dev/null || true
            [ -f tick.json ] && jq -c '.hire // empty' tick.json 2>/dev/null || true
            [ -f tick.json ] && jq -c '.reminders // empty' tick.json 2>/dev/null || true
            # the changes to the automations asked for in chat: counts only
            [ -f tick.json ] && jq -c '.flows // empty | with_entries(.value |= (if type == "object" then (if .cities then {wait, cities: (.cities | map_values({state, moved, ended, added, error}))} else {removed: ((.removed // []) | length), kept: ((.kept // []) | length), changed: ((.changed // []) | length), wait, skipped, error, shapes} end) else . end))' tick.json 2>/dev/null || true
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
