<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Autentificare echipă — Centrul360</title>
<link rel="icon" type="image/png" href="/brand_asset/portal/favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/brand_asset/portal/favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/brand_asset/portal/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0b0d; --fg:#f5f4f2; --muted:rgba(245,244,242,0.58);
    --line:rgba(255,255,255,0.10); --glass:rgba(255,255,255,0.06); --glass-2:rgba(255,255,255,0.14);
    --accent:#cdd8f0; --accent-soft:rgba(150,170,255,0.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--fg);
    background:
      radial-gradient(90% 60% at 100% 0%, var(--accent-soft), transparent 50%),
      var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:380px; border:1px solid var(--line); border-radius:22px;
    background:rgba(255,255,255,0.04); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    padding:2.2rem 1.9rem 2rem;
  }
  .eyebrow{ font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); display:flex; align-items:center; gap:.5rem; margin-bottom:.9rem;}
  .eyebrow i{ width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block;}
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:1.7rem; margin:0 0 .4rem; }
  p.sub{ color:var(--muted); font-size:.92rem; margin:0 0 1.6rem; }
  label{ display:block; font-size:.78rem; color:var(--muted); margin:0 0 .4rem; }
  input{
    width:100%; padding:.8rem .95rem; border-radius:12px; border:1px solid var(--line);
    background:rgba(255,255,255,0.05); color:var(--fg); font-size:.95rem; margin-bottom:1.1rem;
    font-family:inherit;
  }
  input:focus{ outline:2px solid var(--fg); outline-offset:1px; }
  button.pill{
    width:100%; border:none; border-radius:999px; padding:.85rem 1.2rem; font-weight:600;
    font-size:.95rem; cursor:pointer; background:var(--glass-2); color:#fff; font-family:inherit;
    transition:transform .2s ease, background .2s ease;
  }
  button.pill:hover{ transform:translateY(-2px); background:rgba(255,255,255,0.22); }
  button.pill:active{ transform:translateY(0) scale(.98); }
  button.pill:disabled{ opacity:.6; cursor:default; transform:none; }
  .err{
    display:none; margin-top:1rem; padding:.75rem .9rem; border-radius:12px;
    background:rgba(255,90,90,0.12); border:1px solid rgba(255,90,90,0.3);
    color:#ffb3b3; font-size:.85rem;
  }
  .err.show{ display:block; }
  .back{ display:block; text-align:center; margin-top:1.4rem; color:var(--muted); font-size:.82rem; text-decoration:none; }
  .back:hover{ color:var(--fg); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow"><i></i>Zonă privată</div>
    <h1>Portal echipă</h1>
    <p class="sub">Autentifică-te cu contul de angajat Centrul360.</p>
    <form id="loginForm" autocomplete="on">
      <label for="username">Utilizator</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Parolă</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="pill" type="submit" id="submitBtn">Intră în portal</button>
      <div class="err" id="errBox"></div>
    </form>
    <a class="back" href="/">← Înapoi la site</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Se verifică...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const resp = await fetch('/api/portal-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (resp.status === 401) {
          errBox.textContent = 'Utilizator sau parolă incorectă.';
          errBox.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Intră în portal';
          return;
        }
        if (!resp.ok) {
          throw new Error('server');
        }
        location.href = '/portal';
      } catch (err) {
        errBox.textContent = 'A apărut o eroare. Încearcă din nou.';
        errBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Intră în portal';
      }
    });
  </script>
</body>
</html>
