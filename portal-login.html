<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Autentificare · Centrul360 Admin</title>
<link rel="icon" type="image/png" href="/brand_asset/portal/favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/brand_asset/portal/favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/brand_asset/portal/icon-180.png">
<meta name="theme-color" content="#07080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --ink:#f4f5f9; --paper:#ffffff; --surface:#eef0f5; --fg:#0d0f14; --muted:#5d6271; --muted-2:#979dab;
    --line:#e3e6ee; --accent:#6a4dff; --accent-soft:rgba(106,77,255,.10); --bad:#e5484d; --bad-soft:rgba(229,72,77,.10);
    --shadow:0 1px 2px rgba(13,15,20,.04), 0 30px 70px -30px rgba(28,30,60,.32);
    --glow:rgba(106,77,255,.16); --ease:cubic-bezier(.2,.8,.2,1);
  }
  @media all{ /* always dark */
    :root{
      --ink:#07080b; --paper:#101218; --surface:#181b23; --fg:#eef0f7; --muted:#8f96a7; --muted-2:#5b6172;
      --line:#1d2029; --accent:#8c78ff; --accent-soft:rgba(140,120,255,.15); --bad:#ff6b70; --bad-soft:rgba(255,107,112,.13);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 40px 90px -30px rgba(0,0,0,.85); --glow:rgba(140,120,255,.16);
    }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--fg); -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(60% 50% at 85% 0%, var(--glow), transparent 70%),
      radial-gradient(50% 40% at 0% 100%, var(--glow), transparent 70%),
      var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{ width:100%; max-width:400px; animation:rise .7s var(--ease) both; }
  .logo{ display:block; margin:0 auto 1.8rem; height:42px; width:auto; max-width:100%; animation:fade .8s ease both .1s; }
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow);
    padding:2.1rem 1.9rem 1.9rem;
  }
  .eyebrow{ font-size:.66rem; font-weight:650; letter-spacing:.18em; text-transform:uppercase; color:var(--accent);
    display:flex; align-items:center; gap:.55rem; margin-bottom:.8rem; }
  .eyebrow i{ width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  h1{ font-size:1.55rem; font-weight:650; letter-spacing:-.025em; margin:0 0 .35rem; }
  p.sub{ color:var(--muted); font-size:.9rem; margin:0 0 1.7rem; line-height:1.5; }
  label{ display:block; font-size:.76rem; font-weight:550; color:var(--muted); margin:0 0 .4rem; }
  .field{ position:relative; margin-bottom:1.05rem; }
  input{
    width:100%; padding:.82rem .95rem; border-radius:12px; border:1px solid transparent; background:var(--surface);
    color:var(--fg); font-size:.95rem; font-family:inherit; transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input:hover{ border-color:var(--line); }
  input:focus{ outline:none; background:var(--paper); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .toggle{
    position:absolute; right:.45rem; top:50%; transform:translateY(-50%); border:0; background:transparent; color:var(--muted);
    width:34px; height:34px; border-radius:9px; cursor:pointer; display:grid; place-items:center; transition:background .2s ease, color .2s ease;
  }
  .toggle:hover{ background:var(--accent-soft); color:var(--fg); }
  .toggle svg{ width:18px; height:18px; }
  button.pill{
    width:100%; margin-top:.4rem; border:none; border-radius:12px; padding:.88rem 1.2rem; font-weight:600; font-size:.95rem;
    cursor:pointer; background:var(--fg); color:var(--ink); font-family:inherit; display:flex; align-items:center; justify-content:center; gap:.55rem;
    transition:transform .18s var(--ease), box-shadow .2s var(--ease), opacity .2s ease;
  }
  button.pill:hover{ transform:translateY(-1px); box-shadow:0 10px 24px -12px rgba(0,0,0,.45); }
  button.pill:active{ transform:scale(.98); }
  button.pill:disabled{ opacity:.75; cursor:default; transform:none; box-shadow:none; }
  button.pill .spin{ width:15px; height:15px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:spin .7s linear infinite; display:none; }
  button.pill.busy .spin{ display:block; }
  .err{
    display:none; margin-top:1rem; padding:.75rem .9rem; border-radius:12px; background:var(--bad-soft); color:var(--bad); font-size:.85rem;
  }
  .err.show{ display:block; animation:shake .4s var(--ease); }
  .back{ display:block; text-align:center; margin-top:1.4rem; color:var(--muted); font-size:.8rem; text-decoration:none; transition:color .2s ease; }
  .back:hover{ color:var(--fg); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px) scale(.985); } to{ opacity:1; transform:none; } }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } }
  @media (prefers-reduced-motion: reduce){ *, *::before, *::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <picture>

      <img class="logo" src="/brand_asset/portal/logo-white.png" alt="Centrul360">
    </picture>
    <div class="card">
      <div class="eyebrow"><i></i>Zonă privată</div>
      <h1>Bine ai revenit</h1>
      <p class="sub">Autentifică-te cu contul tău Centrul360.</p>
      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="username">Utilizator</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="field">
          <label for="password">Parolă</label>
          <div style="position:relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required style="padding-right:3rem">
            <button type="button" class="toggle" id="togglePw" aria-label="Arată parola">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="pill" type="submit" id="submitBtn"><span class="spin"></span><span id="submitLabel">Intră în portal</span></button>
        <div class="err" id="errBox" role="alert"></div>
      </form>
    </div>
    <a class="back" href="https://www.centrul360.com">← Înapoi la site</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errBox');
    const submitBtn = document.getElementById('submitBtn');
    const submitLabel = document.getElementById('submitLabel');
    const pw = document.getElementById('password');

    document.getElementById('togglePw').addEventListener('click', (e) => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      e.currentTarget.setAttribute('aria-label', show ? 'Ascunde parola' : 'Arată parola');
      pw.focus();
    });

    function busy(on, label) {
      submitBtn.disabled = on;
      submitBtn.classList.toggle('busy', on);
      submitLabel.textContent = label;
    }
    function fail(text) {
      errBox.textContent = text;
      errBox.classList.remove('show');
      void errBox.offsetWidth; // restart the shake animation
      errBox.classList.add('show');
      busy(false, 'Intră în portal');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      busy(true, 'Se verifică…');

      const username = document.getElementById('username').value.trim();
      const password = pw.value;

      try {
        const resp = await fetch('/api/portal-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (resp.status === 401) {
          fail('Utilizator sau parolă incorectă.');
          return;
        }
        if (!resp.ok) {
          throw new Error('server');
        }
        submitLabel.textContent = 'Bine ai venit…';
        location.href = '/portal';
      } catch (err) {
        fail('A apărut o eroare. Încearcă din nou.');
      }
    });
  </script>
</body>
</html>
